name: Scrape diario

# Farmacenter repricia a diario: entre dos dias consecutivos cambiaron de precio
# 18 de 40 productos. Semanal perderia informacion real, no ruido.
on:
  schedule:
    - cron: "0 8 * * *"   # 05:00 en Paraguay (UTC-3)
  workflow_dispatch:       # para poder dispararlo a mano sin esperar al cron

concurrency:
  # Dos corridas simultaneas escribirian el mismo catalogo a la vez. Se deja
  # terminar la que esta en curso en vez de cancelarla: un scrape a medias deja
  # productos sin ver, y las bajas solo son validas sobre una corrida completa.
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # fail-fast off: que Farmatotal falle no es razon para perder Farmaoliva.
      fail-fast: false
      max-parallel: 3
      matrix:
        farmacia: [farmacenter, farmatotal, farmaoliva]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Scrapear ${{ matrix.farmacia }}
        env:
          FARMAWEB_SUPABASE_DB_PASSWORD: ${{ secrets.FARMAWEB_SUPABASE_DB_PASSWORD }}
        run: python -m scraper.${{ matrix.farmacia }}

  enriquecer-ean:
    # Farmatotal solo publica el EAN en la ficha. Se completa de a tandas
    # despues del scrape: el codigo de barras no cambia, no tiene sentido pagar
    # miles de fichas todos los dias.
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scraper/requirements.txt
      - env:
          FARMAWEB_SUPABASE_DB_PASSWORD: ${{ secrets.FARMAWEB_SUPABASE_DB_PASSWORD }}
        run: python -m scraper.farmatotal --enriquecer-ean 2000
